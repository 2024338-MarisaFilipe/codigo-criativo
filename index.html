    const frame = document.getElementById("frame");

    let currentFrame = 0;
    let targetFrame = 0;

  const sensitivity = 0.012;
const smoothness = 0.08;

    // Pré-carregar imagens
    const loadedImages = images.map(src => {
      const img = new Image();
      img.src = src;
      return img;
    });

    // Detetar scroll
    window.addEventListener("wheel", (event) => {

      event.preventDefault();

      const speed = Math.abs(event.deltaY);

      if (event.deltaY < 0) {
        // Scroll para cima: avançar
        targetFrame += speed * sensitivity;
      }

      else if (event.deltaY > 0) {
        // Scroll para baixo: recuar
        targetFrame -= speed * sensitivity;
      }

      targetFrame = Math.max(
        0,
        Math.min(images.length - 1, targetFrame)
      );

    }, { passive: false });

    // Atualizar animação
    function animate() {

      currentFrame +=
        (targetFrame - currentFrame) * smoothness;

      const index = Math.round(currentFrame);

      if (frame.src !== loadedImages[index].src &&
          loadedImages[index].complete &&
          loadedImages[index].naturalWidth > 0) {

        frame.src = loadedImages[index].src;
      }

      requestAnimationFrame(animate);
    }

    animate();

  </script>
